    - type: markdown
      content: '**Zutaten (4 Portionen)**


        - 1 Hokkaido-Kürbis (ca. 800 g)

        - 1 Zwiebel

        - 1 Knoblauchzehe

        - 1 daumengroßes Stück Ingwer

        - 700 ml Gemüsebrühe

        - 200 ml Sahne

        - 2 EL Öl

        - Kürbiskerne zum Bestreuen

        - Salz, Pfeffer, Muskat


        **Zubereitung**


        1. Kürbis waschen, halbieren, Kerne entfernen und samt Schale in Würfel schneiden. Zwiebel, Knoblauch und Ingwer fein hacken.

        2. Öl im Topf erhitzen, Zwiebel glasig dünsten, Knoblauch und Ingwer 1 Min mitbraten.

        3. Kürbiswürfel zugeben und 3–4 Min anbraten, mit der Brühe auffüllen und 15–20 Min weich köcheln.

        4. Suppe fein pürieren, Sahne einrühren und kurz erhitzen. Mit Salz, Pfeffer und Muskat abschmecken.

        5. Kürbiskerne in einer trockenen Pfanne rösten und darüberstreuen.'
