        3. Mit Wein ablöschen, Sahne zugeben und 5 Min einkochen lassen.

        4. Fleisch zurückgeben, nur noch erwärmen, mit Salz und Pfeffer abschmecken. Mit Petersilie, Reis oder Rösti servieren.'
