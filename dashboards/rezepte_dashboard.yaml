    - type: markdown
      content: '**Zutaten (4 Personen)**


        - 1 Brötchen vom Vortag

        - 1 Zwiebel, 1 TL Butter

        - 600 g gemischtes Hackfleisch

        - 1 Ei, 1 EL Tomatenmark, 1 EL mittelscharfer Senf

        - 1 TL getrockneter Thymian, Paprikapulver (edelsüß)

        - Salz, Pfeffer

        - 2–3 EL Mehl zum Wenden, 3 EL Öl zum Braten


        **Zubereitung**


        1. Brötchen in Wasser einweichen. Zwiebel fein würfeln und in der Butter glasig dünsten, abkühlen lassen.

        2. Brötchen gut ausdrücken und mit Hack, Zwiebel, Ei, Tomatenmark, Senf und den Gewürzen zu einer Masse kneten.

        3. Aus der Masse 8 flache Frikadellen formen und leicht im Mehl wenden.

        4. Öl in der Pfanne erhitzen und die Frikadellen bei mittlerer Hitze von jeder Seite 6–8 Min goldbraun braten.

        5. Warm oder kalt servieren, z. B. mit Kartoffelsalat.'
