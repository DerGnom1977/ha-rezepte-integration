        - 300 g Mehl

        - 150 g Butter (kalt)

        - 150 g brauner Zucker

        - 1 Ei

        - 2 TL Spekulatiusgewürz

        - 1 TL Backpulver

        - 50 g Mandelblättchen

        - Außerdem: 1 Prise Salz


        **Zubereitung**


        1. Alle Zutaten zu einem Teig verkneten und über Nacht kalt stellen.

        2. Backofen auf 180 °C vorheizen. Teig 4 mm dick ausrollen, Formen ausstechen.

        3. Mit Mandelblättchen bestreuen und auf Backpapier legen.

        4. 10–12 Min backen.'
