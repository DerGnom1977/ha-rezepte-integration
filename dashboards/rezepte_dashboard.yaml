        **Zubereitung**


        1. Schnitzel zwischen Folie dünn klopfen, mit Salz und Pfeffer würzen.

        2. Nacheinander in Mehl, verquirltem Ei und Semmelbröseln wenden. Panade leicht andrücken.

        3. Reichlich Butterschmalz in der Pfanne erhitzen und die Schnitzel 3–4 Min pro Seite goldbraun ausbacken. Dabei die Pfanne schwenken.

        4. Auf Küchenpapier abtropfen lassen und mit Zitronenspalten servieren.'
