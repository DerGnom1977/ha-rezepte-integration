        **Zubereitung**


        1. Eier mit Zucker und Salz 10 Min cremig-dickschaumig schlagen. Mehl und Anis unterheben.

        2. Mit einem Teelöffel kleine Häufchen auf Backpapier setzen und über Nacht trocknen lassen, bis sich eine feste Haut bildet.

        3. Backofen auf 140 °C vorheizen.

        4. 15–20 Min backen: Sie sollen hell bleiben und ein „Füßchen“ bekommen.'
