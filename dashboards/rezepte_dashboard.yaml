    - type: markdown
      content: '**Zutaten (4 Portionen)**


        - 4 Rinderrouladen

        - 4 TL Senf

        - 4 Scheiben Speck

        - 2 Gewürzgurken

        - 2 Zwiebeln

        - 1 Möhre

        - 2 EL Tomatenmark

        - 500 ml Rinderbrühe

        - Außerdem: Öl, Salz, Pfeffer


        **Zubereitung**


        1. Rouladen flach ausbreiten, mit Salz und Pfeffer würzen und mit Senf bestreichen.

        2. Mit Speck, Zwiebelstreifen und Gurkenstücken belegen, aufrollen und mit Garn oder Rouladennadeln fixieren.

        3. Rouladen in heißem Öl rundherum anbraten, herausnehmen. Möhre und restliche Zwiebel würfeln und im Bratfett anrösten.

        4. Tomatenmark zugeben, mit Brühe ablöschen, Rouladen zurücklegen und zugedeckt 1,5 Std schmoren.

        5. Rouladen herausnehmen, Soße abschmecken und nach Wunsch binden. Mit Kartoffeln und Rotkohl servieren.'
