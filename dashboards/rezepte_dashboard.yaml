        - Boden: 300 g Mehl, 150 g Butter, 100 g Zucker, 1 Ei

        - Belag: 200 g Butter, 200 g Zucker, 1 Päckchen Vanillezucker, 4 EL Wasser, 400 g gehackte Haselnüsse

        - 3 EL Aprikosenmarmelade

        - 150 g Zartbitterkuvertüre


        **Zubereitung**


        1. Backofen auf 180 °C vorheizen. Boden-Zutaten verkneten und auf einem Blech mit Backpapier ausrollen. Mit Marmelade bestreichen.

        2. Butter, Zucker, Vanillezucker und Wasser aufkochen, Haselnüsse einrühren und auf dem Boden verteilen.

        3. 20–25 Min backen, abkühlen lassen und in Dreiecke schneiden.

        4. Die Ecken in geschmolzene Kuvertüre tauchen.'
