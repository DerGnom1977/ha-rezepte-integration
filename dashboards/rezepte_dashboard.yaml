        2. Backofen mit Blech auf 230 °C Ober-/Unterhitze vorheizen.

        3. Teig in 4 Portionen teilen und zu Kreisen ausrollen. Passierte Tomaten mit Salz und Oregano würzen.

        4. Eine Hälfte jedes Kreises mit Soße, Schinken, Champignons und Mozzarella belegen, zuklappen und die Ränder fest andrücken.

        5. Mit Öl bestreichen und 15–18 Min goldbraun backen.'
