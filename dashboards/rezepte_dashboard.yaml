    - type: markdown
      content: '**Zutaten (4 Portionen)**


        - 500 g Spätzle (frisch)

        - 200 g Bergkäse oder Emmentaler, gerieben

        - 3 Zwiebeln

        - 2 EL Butter

        - 1 Bund Schnittlauch

        - Außerdem: Salz, Pfeffer


        **Zubereitung**


