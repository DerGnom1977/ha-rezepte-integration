        - 1 Prise Zimt

        - Oblaten (klein)


        **Zubereitung**


        1. Backofen auf 150 °C vorheizen. Eiweiß steif schlagen, Zucker und Vanillezucker einrieseln lassen.

        2. Haselnüsse und Zimt unterheben.

        3. Mit zwei Teelöffeln Häufchen auf Oblaten setzen.

        4. 20 Min backen.'
