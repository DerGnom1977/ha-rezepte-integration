# Dashboard für Home Assistant: Einstellungen → Dashboards → Dashboard hinzufügen (URL dashboard-rezepte),
# dann ⋮ → Raw-Konfigurationseditor und diesen Inhalt einfügen.
title: Rezepte
views:
- title: Suppen und Eintöpfe
  path: rezepte
  icon: mdi:pot-steam-outline
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Suppen und Eintöpfe
      heading_style: title
      icon: mdi:pot-steam-outline
    - type: conditional
      conditions:
      - condition: state
        entity: switch.kategorie_ausblenden_rezepte
        state: 'on'
      card:
        type: markdown
        content: Diese Kategorie ist ausgeblendet. Du kannst sie unter **Verwalten** wieder einblenden.
    - type: conditional
      grid_options:
        columns: 6
      conditions:
      - condition: state
        entity: switch.rezept_ausblenden_kaese_lauch_suppe
        state: 'off'
      - condition: state
        entity: switch.kategorie_ausblenden_rezepte
        state: 'off'
      card:
        type: button
        name: Käse-Lauch-Suppe
        icon: mdi:pot-steam-outline
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /dashboard-rezepte/rezept-kaese-lauch-suppe
