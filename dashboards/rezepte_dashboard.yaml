    - type: markdown
      content: '**Zutaten (4–6 Portionen)**


        - 500 g Hackfleisch gemischt

        - 1 Zwiebel

        - 1 Knoblauchzehe

        - 2 EL Tomatenmark

        - 500 g passierte Tomaten

        - 250 g Lasagneplatten

        - 50 g Butter

        - 50 g Mehl

        - 600 ml Milch

        - 200 g geriebener Käse (Mozzarella oder Gouda)

        - 1 TL Oregano

        - Öl, Salz, Pfeffer, Muskat


        **Zubereitung**


        1. Zwiebel und Knoblauch hacken. Hack in Öl krümelig anbraten, Zwiebel und Knoblauch mitbraten.

        2. Tomatenmark kurz mitrösten, passierte Tomaten und Oregano zugeben, salzen, pfeffern und 15–20 Min köcheln lassen.

        3. Für die Béchamel Butter schmelzen, Mehl 1 Min anschwitzen und die Milch nach und nach einrühren. 5 Min köcheln, mit Salz, Pfeffer und Muskat würzen.

        4. Backofen auf 180 °C Ober-/Unterhitze vorheizen. Eine Auflaufform abwechselnd mit Hacksauce, Lasagneplatten und Béchamel schichten. Oben mit Béchamel abschließen.

        5. Käse darüberstreuen und 35–40 Min backen, bis die Oberfläche goldbraun ist. Vor dem Anschneiden 5–10 Min ruhen lassen.'
