- title: Käse-Lauch-Suppe
  path: rezept-kaese-lauch-suppe
  subview: true
  back_path: /dashboard-rezepte/rezepte
  type: sections
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Käse-Lauch-Suppe
      heading_style: title
      icon: mdi:pot-steam-outline
    - type: tile
      entity: select.rezepte_einkauf_markt
      name: Einkaufen bei
      features:
      - type: select-options
    - type: button
      name: Zutaten auf die Einkaufsliste
      icon: mdi:cart-plus
      tap_action:
        action: perform-action
        perform_action: rezepte.rezept_einkaufen
        data:
          rezept: kaese_lauch_suppe
        confirmation:
          text: Zutaten für „Käse-Lauch-Suppe“ auf die Einkaufsliste setzen?
    - type: markdown
      content: '**Zutaten (großer Topf, viele Portionen)**


        - 1 kg Hackfleisch (gemischt oder Rind)

        - 1 kg Zwiebeln (ca. 6–8 Stück)

        - 1 kg Lauch / Porree (ca. 3–4 Stangen)

        - 300–600 g Sahneschmelzkäse (je nach Becher 3 × 100 g oder 3 × 200 g)

        - 300–600 g Kräuterschmelzkäse (ebenfalls 3 Becher)

        - 1 l Gemüsebrühe

        - Etwas Öl oder Butter zum Anbraten

        - Salz, Pfeffer, etwas Muskatnuss und Paprikapulver


        **Zubereitung**


        1. Lauch gründlich waschen (auch zwischen den Blättern), Wurzelansatz und hartes dunkles Grün entfernen und in feine Ringe schneiden. Zwiebeln schälen und klein würfeln.

        2. Öl oder Butter in einem sehr großen Topf oder Bräter erhitzen. Zwiebeln darin glasig andünsten.

        3. Hackfleisch zugeben und unter Rühren krümelig und braun anbraten. Mit Salz und Pfeffer würzen.

        4. Lauchringe zum Hack geben und 3–5 Min mitdünsten, bis sie leicht zusammenfallen.

        5. Mit 1 l Gemüsebrühe ablöschen, aufkochen und bei mittlerer Hitze 10–15 Min köcheln lassen, bis der Lauch weich ist.

        6. Hitze reduzieren. Alle Becher Sahne- und Kräuterschmelzkäse löffelweise einrühren und bei kleiner Hitze rühren, bis der Käse ganz geschmolzen und die Suppe cremig ist.

        7. Mit Pfeffer, Muskat und eventuell Paprikapulver abschmecken. Mit Salz vorsichtig sein, denn Käse und Brühe sind schon würzig.'
