        - 250 g gelbe Schälerbsen

        - 3 festkochende Kartoffeln (je ca. 120 g)

        - 1 Bund Suppengrün, 1 Zwiebel

        - 100 g Speckwürfel

        - 1,5 l Gemüsebrühe

        - 1 Lorbeerblatt, 1 TL Majoran, Salz, Pfeffer

        - 4 Wiener oder Mettwürstchen


        **Zubereitung**


        1. Zwiebel, Suppengrün und Kartoffeln schälen und würfeln.

        2. Speck im Topf auslassen, Zwiebel darin anbraten.

        3. Suppengrün kurz mitbraten, dann Erbsen, Lorbeer und Brühe zugeben und aufkochen.

        4. Bei kleiner Hitze ca. 30 Min köcheln lassen. Gelegentlich umrühren.

        5. Kartoffeln zugeben und weitere 20–25 Min garen, bis die Erbsen zerfallen und die Suppe sämig ist.

        6. Würstchen in Scheiben schneiden und kurz miterhitzen. Mit Majoran, Salz und Pfeffer abschmecken.'
