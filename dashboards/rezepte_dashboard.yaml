        2. Zwiebeln und Pilze im Bratfett anbraten, Tomatenmark kurz mitrösten.

        3. Mit Brühe ablöschen, 5 Min köcheln lassen, Sahne einrühren und mit Paprika, Salz und Pfeffer abschmecken.

        4. Schnitzel mit der Soße und Petersilie anrichten, dazu Nudeln oder Spätzle.'
