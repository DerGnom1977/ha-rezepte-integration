    - type: markdown
      content: '**Zutaten (ca. 6 Portionen)**


        - 1 kg Hähnchenkeulen (mit Knochen und Haut)

        - 2 Zwiebeln, 3 große Möhren, 150 g Sellerie, 1 Stange Lauch

        - 2 Lorbeerblätter, 1 TL Pfefferkörner, 1 gestr. EL Salz

        - 125 g Fadennudeln oder Suppennudeln

        - Pfeffer, etwas Petersilie


        **Zubereitung**


        1. Hähnchenkeulen waschen und mit knapp 2,5 l kaltem Wasser, Lorbeer, Pfefferkörnern und Salz in den Topf geben. Aufkochen und den Schaum abschöpfen.

        2. Zwiebeln halbieren und mitkochen. Bei kleiner Hitze ca. 60 Min ziehen lassen, bis das Fleisch weich ist.

        3. Möhren, Sellerie und Lauch putzen und in Stücke oder Scheiben schneiden.

        4. Keulen herausnehmen, die Brühe durchsieben. Das Fleisch vom Knochen lösen und klein zupfen.

        5. Gemüse in der Brühe 10–15 Min weich garen, dann die Nudeln nach Packungsanleitung mitkochen.

        6. Fleisch zurück in die Suppe geben, mit Salz und Pfeffer abschmecken und mit Petersilie servieren.'
