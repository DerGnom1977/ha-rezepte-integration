        - 2 Zwiebeln

        - 2 EL Tomatenmark

        - 200 ml Fleischbrühe

        - 100 ml Sahne

        - 4 EL Mehl

        - 1 Bund Petersilie

        - Außerdem: Öl, Salz, Pfeffer, Paprikapulver


        **Zubereitung**


