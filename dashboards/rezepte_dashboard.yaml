    - type: markdown
      content: '**Zutaten (1 Brot)**


        - 500 g Weizenmehl

        - 1 Päckchen Trockenhefe

        - 250 g Joghurt

        - 150 ml lauwarmes Wasser

        - 2 TL Salz

        - 1 TL Zucker

        - 3 EL Öl

        - Körner zum Bestreuen


        **Zubereitung**


        1. Alle Zutaten 8 Min zu einem glatten Teig kneten und abgedeckt 1 Std gehen lassen.

        2. Teig zu einem Laib formen, in eine gefettete Kastenform legen und 30 Min gehen lassen. Backofen auf 220 °C vorheizen.

        3. Mit Wasser bestreichen und mit Körnern bestreuen.

        4. 15 Min bei 220 °C, dann 25 Min bei 190 °C backen. Auf einem Gitter abkühlen lassen.'
