        3. Passierte Tomaten mit Salz, Oregano und 1 EL Öl verrühren. Teig dünn ausrollen, mit der Soße bestreichen und mit zerzupftem Mozzarella belegen.

        4. 12–15 Min goldbraun backen.

        5. Mit Schinken, Rucola und gehobeltem Parmesan belegen und mit Öl beträufeln.'
