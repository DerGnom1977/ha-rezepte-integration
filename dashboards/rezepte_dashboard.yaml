    - type: markdown
      content: '**Zutaten (ca. 4 Portionen)**


        - 300 g Tellerlinsen

        - 2 Zwiebeln, 4 festkochende Kartoffeln, 1 Bund Suppengrün

        - 100 g Speckwürfel

        - 1,5 l Gemüsebrühe

        - 1–2 Pimentkörner, Salz, Pfeffer

        - 2 EL Weißweinessig

        - 4 Wiener Würstchen, etwas Petersilie


        **Zubereitung**


        1. Zwiebeln, Kartoffeln und Suppengrün schälen bzw. putzen und würfeln.

        2. Speck im Topf auslassen, Zwiebeln darin glasig anbraten.

        3. Suppengrün, Linsen und Piment zugeben, mit der Brühe auffüllen und aufkochen.

        4. 20 Min köcheln lassen, dann die Kartoffeln zugeben und weitere 15–20 Min garen, bis alles weich ist.

        5. Würstchen in Scheiben schneiden und kurz miterhitzen.

        6. Mit Essig, Salz und Pfeffer abschmecken und mit gehackter Petersilie servieren.'
