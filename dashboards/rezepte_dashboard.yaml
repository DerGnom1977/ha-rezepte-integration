          text: Zutaten für „Pizza Margherita“ auf die Einkaufsliste setzen?
    - type: markdown
      content: '**Zutaten (1 Blech (3–4 Portionen))**


        - Pizzateig: 400 g Mehl, 1 Päckchen Trockenhefe, 250 ml lauwarmes Wasser, 3 EL Öl, 1 TL Salz, 1 TL Zucker

        - 400 g passierte Tomaten

        - 250 g Mozzarella

        - 1 Topf Basilikum

        - Außerdem: Öl, Salz, Oregano


        **Zubereitung**


        1. Mehl, Hefe, Salz und Zucker mischen, Wasser und Öl zugeben und 8 Min zu einem glatten Teig kneten. Abgedeckt 45 Min gehen lassen.

        2. Backofen mit Blech auf 230 °C Ober-/Unterhitze vorheizen.

        3. Passierte Tomaten mit Salz, Oregano und 1 EL Öl verrühren. Teig auf einem bemehlten Backpapier dünn ausrollen und mit der Soße bestreichen.

        4. Mozzarella zerzupfen und auf der Soße verteilen.

        5. Mit dem Backpapier auf das heiße Blech ziehen und 12–15 Min goldbraun backen. Mit Basilikum servieren.'
