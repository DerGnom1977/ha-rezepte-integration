    - type: markdown
      content: '**Zutaten (2–3 Portionen)**


        - 4 Eier

        - 250 ml Milch

        - 150 g Mehl

        - 3 EL Zucker

        - 1 Päckchen Vanillezucker

        - 2 EL Rosinen

        - 3 EL Butter

        - 1 Prise Salz

        - Puderzucker zum Bestäuben


        **Zubereitung**


        1. Eier trennen. Eigelb mit Milch, Mehl, 2 EL Zucker, Vanillezucker und Salz glatt verrühren.

        2. Eiweiß mit einer Prise Salz steif schlagen und vorsichtig unter den Teig heben.

        3. Butter in einer großen Pfanne erhitzen, den Teig hineingeben und die Rosinen darüberstreuen. Bei mittlerer Hitze 3–4 Min backen, bis die Unterseite goldbraun ist.

        4. Teig in Stücke teilen, wenden und weitere 3–4 Min backen. Mit zwei Gabeln in Stücke zerreißen.

        5. Restlichen Zucker darüberstreuen, kurz karamellisieren lassen und mit Puderzucker bestäuben.'
