        - 250 g Champignons

        - 1 Zwiebel

        - 1 EL Mehl

        - 100 ml Weißwein

        - 250 ml Sahne

        - 1 Bund Petersilie

        - 300 g Reis oder Rösti

        - Außerdem: Butter, Salz, Pfeffer


        **Zubereitung**


