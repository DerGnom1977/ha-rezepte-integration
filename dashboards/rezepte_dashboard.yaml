        data:
          rezept: donauwelle
        confirmation:
          text: Zutaten für „Donauwelle“ auf die Einkaufsliste setzen?
    - type: markdown
      content: '**Zutaten (1 Blech (24 Stücke))**


        - Teig: 250 g Butter, 250 g Zucker, 1 Päckchen Vanillezucker, 5 Eier, 300 g Mehl, 1 Päckchen Backpulver

        - 2 EL Kakao

        - 2 EL Milch

        - 1 Glas Sauerkirschen (720 ml)

        - Creme: 1 Päckchen Vanillepuddingpulver, 500 ml Milch, 50 g Zucker, 250 g weiche Butter

        - Guss: 200 g Zartbitterkuvertüre, 1 EL Kokosfett


        **Zubereitung**


        1. Backofen auf 180 °C vorheizen. Butter, Zucker und Vanillezucker schaumig rühren, Eier einzeln unterrühren, Mehl mit Backpulver unterheben.

        2. Die Hälfte des Teigs auf ein Blech streichen. Unter den Rest Kakao und Milch rühren und darüber verteilen. Abgetropfte Kirschen eindrücken. 30–35 Min backen und auskühlen lassen.

        3. Pudding aus Pulver, Milch und Zucker kochen und abkühlen lassen. Weiche Butter schaumig rühren und den Pudding löffelweise unterrühren. Auf den Kuchen streichen und kalt stellen.

        4. Kuvertüre mit Kokosfett schmelzen, darüber streichen und mit einer Gabel wellenförmig durchziehen.'
