        3. Speck und Zwiebelwürfel zugeben und weitere 5 Min braten. Mit Salz und Pfeffer würzen.

        4. Eier in einer zweiten Pfanne zu Spiegeleiern braten und mit Schnittlauch auf den Kartoffeln servieren.'
