    - type: markdown
      content: '**Zutaten (4 Portionen)**


        - 500 g gemischtes Hackfleisch

        - 1 Brötchen vom Vortag

        - 1 Zwiebel

        - 1 Ei

        - 1 l Gemüse- oder Fleischbrühe

        - 40 g Butter

        - 40 g Mehl

        - 100 ml Sahne

        - 3 EL Kapern

        - 1 Zitrone

        - 800 g Kartoffeln

        - Außerdem: Salz, Pfeffer, Lorbeer


        **Zubereitung**


        1. Brötchen einweichen, ausdrücken und mit Hack, gehackter Zwiebel, Ei, Salz und Pfeffer verkneten. 8 Klopse formen.

        2. Brühe mit Lorbeer aufkochen, Klopse zugeben und bei kleiner Hitze 15 Min gar ziehen lassen. Herausnehmen, Brühe aufbewahren.

        3. Butter schmelzen, Mehl anschwitzen, mit 500 ml der Brühe ablöschen und 5 Min köcheln. Sahne, Kapern und Zitronensaft einrühren.

        4. Klopse in der Soße erwärmen und mit Salzkartoffeln servieren.'
