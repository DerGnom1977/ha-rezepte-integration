        confirmation:
          text: Zutaten für „Knuspriger Blumenkohl Mac and Cheese“ auf die Einkaufsliste setzen?
    - type: markdown
      content: '**Zutaten (ca. 3–4 Portionen)**


        - 250 g Makkaroni (oder kurze Nudeln)

        - 300 g Blumenkohlröschen

        - 2 EL Butter, 2 EL Mehl, 250 ml Milch

        - 100–150 g geriebener Cheddar oder kräftiger Bergkäse

        - 1 TL Senf, 1 TL Paprikapulver

        - 1 Prise Muskat, Salz, Pfeffer

        - 3 EL Panko für die Kruste


        **Zubereitung**


        1. Backofen auf 200 °C Ober-/Unterhitze vorheizen.

        2. Nudeln in Salzwasser 2 Min kürzer als auf der Packung kochen. Die Blumenkohlröschen in den letzten 3–4 Min mitkochen, dann abgießen.

        3. Butter im Topf schmelzen, Mehl 1 Min unter Rühren anschwitzen. Milch nach und nach einrühren und 3–5 Min köcheln lassen, bis die Sauce cremig ist.

        4. Etwa zwei Drittel vom Käse einrühren. Mit Senf, Paprika, Muskat, Salz und Pfeffer abschmecken.

        5. Nudeln und Blumenkohl unter die Sauce heben und in eine Auflaufform geben.

        6. Restlichen Käse mit dem Panko und etwas zerlassener Butter oder Öl mischen und darüberstreuen.

        7. 15–20 Min backen, bis die Kruste goldbraun ist. Vor dem Servieren 5 Min ruhen lassen.'
