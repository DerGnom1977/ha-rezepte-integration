    - type: markdown
      content: '**Zutaten (6 Portionen)**


        - 1,2 kg Schweineschulter mit Schwarte

        - 3 Zwiebeln

        - 2 Möhren

        - 3 Knoblauchzehen

        - 1 EL Kümmel

        - 500 ml Fleischbrühe

        - 1 EL Senf

        - Außerdem: Salz, Pfeffer, Paprikapulver


        **Zubereitung**


        1. Backofen auf 180 °C Ober-/Unterhitze vorheizen. Schwarte rautenförmig einschneiden, mit Salz, Pfeffer, Paprika, Kümmel und Senf einreiben.

        2. Zwiebeln, Möhren und Knoblauch grob schneiden und in einen Bräter geben, Braten mit der Schwarte nach oben daraufsetzen und 250 ml Brühe angießen.

        3. 2 Std braten, dabei gelegentlich mit Bratensaft begießen und Brühe nachgießen.

        4. Für die Kruste die letzten 15 Min auf 220 °C Oberhitze stellen. 10 Min ruhen lassen, aufschneiden und mit der passierten Soße servieren.'
