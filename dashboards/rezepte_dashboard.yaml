        - 2 Knoblauchzehen

        - 200 g grüne Bohnen

        - 400 g gehackte Tomaten (Dose)

        - 1 l Gemüsebrühe

        - 100 g Suppennudeln

        - 40 g Parmesan

        - Außerdem: Olivenöl, Salz, Pfeffer, Basilikum


        **Zubereitung**


        1. Gemüse putzen und in kleine Würfel schneiden, Bohnen in Stücke brechen. Zwiebel und Knoblauch hacken.

        2. 3 EL Olivenöl erhitzen, Zwiebel, Knoblauch, Möhren und Sellerie 5 Min andünsten.

        3. Tomaten und Brühe zugeben, aufkochen und 15 Min köcheln lassen.

        4. Zucchini, Bohnen und Nudeln zugeben und 10 Min garen. Mit Salz und Pfeffer abschmecken, mit Parmesan und Basilikum servieren.'
